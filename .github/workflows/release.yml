name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

# Radix's numeric stack (astro-float 0.3.2) only defines its word types for
# x86_64/x86, so release artifacts are x86_64-only until that dependency
# gains aarch64 support.

jobs:
  linux:
    name: Release build, tarball, deb
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            debhelper \
            build-essential \
            cargo

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Smoke test (--version)
        run: ./target/release/radix --version

      - name: Build Debian package
        run: |
          cp -r packaging/debian ./debian
          dpkg-buildpackage -us -uc -b
          mv ../radix_*.deb ./
          ls -l *.deb

      - name: Package release tarball
        run: |
          V="${GITHUB_REF_NAME#v}"
          mkdir "radix-${V}"
          cp target/release/radix README.md LICENSE "radix-${V}/"
          tar -cJf "radix-${V}-linux-x86_64.tar.xz" "radix-${V}"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            *.tar.xz
            *.deb
          if-no-files-found: error

  rpm:
    name: RPM package (Fedora)
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - name: Install build tools
        run: |
          dnf install -y git cargo rpm-build \
            gtk4-devel libadwaita-devel

      - uses: actions/checkout@v4

      - name: Build RPM
        run: |
          V="${GITHUB_REF_NAME#v}"
          # RPM Version is 51.0.0~rc1, so %setup expects radix-51.0.0~rc1/.
          RV="${V/-rc./~rc}"
          mkdir -p "$HOME/rpmbuild/SOURCES"
          tar --exclude-vcs -czf "$HOME/rpmbuild/SOURCES/radix-${V}.tar.gz" \
            --transform "s,^,radix-${RV}/," .
          rpmbuild -bb --define "_topdir $HOME/rpmbuild" packaging/fedora/radix.spec
          cp "$HOME/rpmbuild/RPMS/x86_64"/radix-*.rpm ./

      - uses: actions/upload-artifact@v4
        with:
          name: rpm-x86_64
          path: "*.rpm"
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [linux, rpm]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Radix ${GITHUB_REF_NAME#v}" \
            --notes "First release candidate of Radix 51.0.0, an independent clean-room desktop calculator tracking the GNOME Calculator 51 behavioral specification.

          Assets are provided for x86_64 (amd64): Debian package, Fedora RPM and a standalone tarball. aarch64 is not shipped yet because the astro-float dependency only supports x86." \
            --latest
