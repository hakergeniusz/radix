[package]
name = "radix"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Radix — an independent desktop calculator"
rust-version = "1.85"

[dependencies]
radix-engine = { path = "crates/radix-engine" }
gtk = { package = "gtk4", version = "0.10", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.8", features = ["v1_5"] }
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
serde_json = "1"

[workspace]
members = ["crates/radix-engine"]
resolver = "3"

[profile.release]
lto = "thin"
strip = "symbols"
