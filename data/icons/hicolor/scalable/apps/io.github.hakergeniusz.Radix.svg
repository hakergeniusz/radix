<?xml version="1.0" encoding="UTF-8"?>
<!--
  Radix application icon — original artwork (MIT).
  Concept: a radical (√) over a decimal point — "the root of a number" —
  on a dark rounded tile that reads well in light and dark themes.
  Accent #d56199 matches the application's accent colour.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4a50"/>
      <stop offset="1" stop-color="#313136"/>
    </linearGradient>
  </defs>

  <!-- Tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#tile)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none"
        stroke="#ffffff" stroke-opacity="0.07" stroke-width="4"/>

  <!-- Radical sign -->
  <path d="M 116 268
           L 182 258
           L 248 396
           L 322 128
           L 404 128"
        fill="none"
        stroke="#d56199"
        stroke-width="46"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Decimal point (the radix) -->
  <circle cx="384" cy="330" r="34" fill="#f2f2f2"/>
</svg>
